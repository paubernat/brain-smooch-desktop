# Política de decisión (PLAN §8). Editable a mano o desde «Configura tu perfil» en la
# extensión. Cada guardado sube `version`; las anteriores quedan en policy/history/.
version: 11
question:
  id: tier
  type: choice
  instructions: >-
    Clasifica este vídeo de YouTube según cómo quiere usar YouTube su dueño: formación y música de calidad
    sin límite, entretenimiento largo y con sustancia con cupo, y nada de contenido adictivo, viral, de
    relleno, ni de política y actualidad. Primero aplica la lista de canales; si no hay regla, compara
    la ficha con los criterios de cada opción. Ante la duda, LIMITADO.
  options:
    "NO":
      description: >-
        Videojuegos (League of Legends y esports; GTA 6 y su actualidad) y deportes de cualquier tipo
        (NBA, tenis de mesa, disc golf). Política y actualidad: noticias, debates, elecciones y comentario
        político o partidista, aunque sea de medios o divulgadores (laSexta, El País, Pakman, HasanAbi,
        Rallo). Shorts de relleno, clips virales, sketches y humor de youtubers (Druski, NDL), retos,
        memes, listas sensacionalistas, contenido de IA genérico. Música tangencial sin tocar ni enseñar
        (reparar pianos, anécdotas). Un canal de LIMITADO prevalece.
    LIMITADO:
      description: >-
        Entretenimiento largo con cupo: commentary, humor, vlogs, podcasts y shows de creadores aceptados
        (The Yard, dunkey, Ludwig, orslok), reseñas humorísticas de juegos de esos canales, experimentos
        o inventos DIY (I did a thing) y explicadores de geopolítica o temas militares (WarFronts). Ante
        la duda entre NO, LIMITADO y LIBRE, LIMITADO. Si parece NO por ser gaming o deporte pero es de
        un canal listado aquí, LIMITADO. Política de actualidad partidista de canales no listados sigue
        siendo NO.
    LIBRE:
      description: >-
        Música con sustancia: alguien tocando (piano, jazz) con los acordes o la partitura en pantalla,
        explicaciones de acordes, voicings, armonía o melodía, transcripciones, covers y tutoriales de
        cómo tocar temas (Jeff Schneider). Técnico de calidad: arquitectura de software, tutoriales de
        Azure, IA explicada con rigor por fuentes con criterio (canales que hablan de las cosas con propiedad,
        p. ej. Fireship o DeepSeek). Shorts incluidos si cumplen esto.
auxiliary_questions:
- id: is_music_education
  type: boolean
  instructions: ¿Enseña o muestra música con sustancia (acordes, armonía, partitura, tutorial)?
- id: is_gaming
  type: boolean
  instructions: ¿Trata principalmente sobre videojuegos?
- id: is_sports
  type: boolean
  instructions: ¿Trata principalmente sobre deportes?
- id: is_political_news
  type: boolean
  instructions: ¿Trata de política, elecciones, debates o noticias de actualidad?
- id: is_low_effort_listicle
  type: boolean
  instructions: >-
    ¿Es una lista sensacionalista, recopilación o contenido de relleno de bajo esfuerzo?
- id: is_short_viral_filler
  type: boolean
  instructions: ¿Es un Short viral o de relleno sin relación con música o tecnología de calidad?
channel_lists:
  "NO": []
  LIMITADO: [Atrioc, dunkey, Ludwig, The Yard, Good Work, Cheese Factory, geopold, orslok, WarFronts,
    Big A]
  LIBRE: [Fireship, DeepSeek]
rules:
  block_ai_labeled: true
  block_live: true
blocked_sites: [twitch.tv]
